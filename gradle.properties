#Kotlin
kotlin.code.style=official
#kotlin.daemon.jvmargs=-Xmx2048M
ksp.useKSP2=true
#kotlin.mpp.enableCInteropCommonization=true disabled for ksp2

#Gradle
#org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xms4g -Xmx8g -Dfile.encoding=UTF-8
#org.gradle.warning.mode=(all,fail,summary,none) --> summary is default
org.gradle.warning.mode=all
#kotlin.native.cacheKind.iosSimulatorArm64=none
kotlin.native.cacheKind=none

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
org.gradle.configuration-cache=true
#kotlin.native.disableCompilerDaemon = true kotlin 2.0 nao pode ter isso

android.experimental.kmp.enableAndroidResources = true

